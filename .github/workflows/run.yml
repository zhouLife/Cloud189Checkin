name: Cloud check in action

on:
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 random delay 0-300 seconds
        run: sleep $((RANDOM % 301))

      - name: 🔌 Check out code
        uses: actions/checkout@v4

      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 👾 Check if Debug is true
        if: vars.debug == '1'
        run: echo "CLOUD189_VERBOSE=1" >> $GITHUB_ENV

      - name: 📹 Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: ${{ runner.os }}-cache-token
          restore-keys: ${{ runner.os }}-cache-token-

      # 使用原生 shell 生成 .env，不再调用第三方插件和 toJSON(secrets)
      - name: 🔧 Init secrets
        env:
          USER: ${{ secrets.USER }}
          PWD: ${{ secrets.PWD }}
        run: |
          echo "USER=${USER}" >> .env
          echo "PWD=${PWD}" >> .env

      - name: 📡 Init dependencies
        run: npm install

      - name: 🚀 Run
        run: npm start

      - name: 📹 Save cached Cookie
        uses: actions/cache/save@v4
        with:
          path: .token
          key: ${{ runner.os }}-cache-token-${{ hashFiles('.token/*.json') }}

      - name: 🎉 Delete old workflow run
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50
